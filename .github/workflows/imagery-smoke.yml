name: Check validated-course imagery downloads
on:
  push:
    branches: [codex/imagery-download-checks]
    paths: ['imagery_checks/**', '.github/workflows/imagery-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: imagery-download-research
  cancel-in-progress: false
jobs:
  imagery:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install Pillow==13.0.0 pytest==8.3.5 jsonschema==4.23.0
      - run: python -m pytest imagery_checks/test_check.py -q
      - run: python -m imagery_checks.check verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '39903637565'
          name: national-validation-evidence
          path: .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '39706691352'
          name: national-validation-evidence
          path: baseline
      - name: Sequential USDA downloads and saved-file reopen checks
        run: python -m imagery_checks.check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: imagery-smoke-evidence
          path: |
            work/imagery-checks/*.json
            work/imagery-checks/*.md
            work/imagery-checks/contact-sheet-*.jpg
            work/imagery-checks/previews
          retention-days: 7
      - if: always()
        run: |
          if [ -f work/imagery-checks/report.md ]; then
            head -n 10 work/imagery-checks/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
