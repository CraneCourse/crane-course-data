name: Survey national mapped geometry
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: national-geometry-survey
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      extracts: ${{ steps.selection.outputs.extracts }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m pipeline.national verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '38981104633'
          name: national-directory-inventory
          path: .
      - id: selection
        run: python -m pipeline.national prepare
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: national-selection
          path: |
            work/catalog
            work/national
            reports/catalog-inventory-38981104633.json
          retention-days: 7
  states:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        extract: ${{ fromJSON(needs.prepare.outputs.extracts) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool
          pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: national-selection
          path: .
      - id: date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: work/extracts/${{ matrix.extract }}
          key: filtered-v1-${{ matrix.extract }}-${{ steps.date.outputs.day }}
      - run: python -m pipeline.national "$COURSE_EXTRACT"
        env:
          COURSE_EXTRACT: ${{ matrix.extract }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: national-state-${{ matrix.extract }}
          path: work/national
          retention-days: 7
  report:
    if: always() && needs.prepare.result == 'success'
    needs: [prepare, states]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: national-selection
          path: .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          pattern: national-state-*
          merge-multiple: true
          path: work/national
      - id: report
        continue-on-error: true
        run: python -m pipeline.national report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: national-geometry-evidence
          path: |
            work/national
            reports/national-geometry-*
          retention-days: 7
      - name: Record completed or incomplete accounting; never deploy
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/national-geometry-* reports/LATEST-NATIONAL.md
          git commit -m "Record national geometry survey $GITHUB_RUN_ID"
          git pull --rebase origin main
          git push origin HEAD:main
      - if: steps.report.outcome != 'success'
        run: exit 1
