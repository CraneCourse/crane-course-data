name: Measure public course data
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: measurement
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      states: ${{ steps.selection.outputs.states }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - id: selection
        run: python -m pipeline.prepare
      - id: date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: work/scorecards
          key: scorecards-v1-${{ steps.date.outputs.day }}-${{ hashFiles('inputs/sample.json') }}
      - run: python -m pipeline.scorecards
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecards
          path: work/scorecards
          retention-days: 7
  states:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        state: ${{ fromJSON(needs.prepare.outputs.states) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool
          pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scorecards
          path: work/scorecards
      - id: date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: work/extracts/${{ matrix.state }}
          key: filtered-v1-${{ matrix.state }}-${{ steps.date.outputs.day }}
      - env:
          COURSE_STATE: ${{ matrix.state }}
        run: python -m pipeline.run_state "$COURSE_STATE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: result-${{ matrix.state }}
          path: work/results
          retention-days: 7
  report:
    if: ${{ always() && needs.prepare.result == 'success' }}
    needs: [prepare, states]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          pattern: result-*
          merge-multiple: true
          path: work/results
      - run: python -m pipeline.report
      - name: Commit the measurement report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/
          git commit -m "Record course-data measurement $GITHUB_RUN_ID"
          git pull --rebase origin main
          git push origin HEAD:main
