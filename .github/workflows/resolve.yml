name: Validate layout and scorecard corrections
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only after pinned official sources and all validation gates pass
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: course-data-publication
  cancel-in-progress: false
jobs:
  validate:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    env:
      PUBLISH: ${{ inputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m pipeline.resolve_layouts verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: python -m pipeline.verify_input_run
        env:
          INPUT_RUN: '38971124409'
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '38976460499'
          name: layout-inputs
          path: work
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '38976460499'
          name: layout-audit-evidence
          path: work
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '38971124409'
          name: controls
          path: work/validation
      - run: python -m pipeline.refresh_matches
      - run: python -m pipeline.resolve_layouts prepare
      - name: Compile and run actual Swift matching kernel
        run: |
          swiftc -O reference/AppKernel.swift reference/main.swift -o /tmp/course-reference
          /tmp/course-reference work/validation work/swift.json
      - name: Replay existing real regression controls
        run: |
          mkdir -p work/replay
          python -m pipeline.replay
      - run: python -m pipeline.export
      - run: python -m pipeline.resolve_layouts report
      - run: python -m pytest -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: layout-validation-evidence
          path: |
            work/swift.json
            work/validation
            work/layout-resolution.json
            reports/layout-resolution-*
          retention-days: 7
      - name: Record cloud validation results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/ tests/fixtures/
          git commit -m "Record validated layout corrections $GITHUB_RUN_ID"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        if: inputs.publish
        with:
          path: dist
          retention-days: 1
  deploy:
    if: inputs.publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
