name: Tests
on:
  push:
    branches: [main]
    paths: ['pipeline/**', 'tests/**', '.github/workflows/**', 'requirements.txt']
  workflow_dispatch:
    inputs:
      reference_checks:
        description: Run macOS feature-distance regression against Core Location
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
  feature-parity:
    if: github.event_name == 'workflow_dispatch' && inputs.reference_checks
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q -s tests/test_feature_parity.py
