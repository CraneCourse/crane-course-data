name: Audit neighboring layouts and scorecards
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: course-layout-audit
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # Commits the OpenGolfAPI ledger reservation before requests.
      actions: read
    outputs:
      states: ${{ steps.selection.outputs.states }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - id: selection
        run: python -m pipeline.prepare
      - run: python -m pipeline.verify_input_run
        env:
          INPUT_RUN: '38971124409'
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: '38971124409'
          pattern: result-*
          merge-multiple: true
          path: work
      - name: Reserve OpenGolfAPI requests in the repository-wide daily ledger
        run: python -m pipeline.api_ledger reserve "$(python -m pipeline.api_ledger need layout-details)" layout-details
      - run: python -m pipeline.layout_audit details
      - name: Record OpenGolfAPI use against the reservation (never refunded)
        if: always()
        run: python -m pipeline.api_ledger record
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layout-inputs
          path: |
            work/validation
            work/details
          retention-days: 7
  states:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        state: ${{ fromJSON(needs.prepare.outputs.states) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: layout-inputs
          path: work
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: work/extracts/${{ matrix.state }}
          key: filtered-v1-${{ matrix.state }}-2026-10-16
          fail-on-cache-miss: true
      - env:
          COURSE_STATE: ${{ matrix.state }}
        run: python -m pipeline.layout_audit "$COURSE_STATE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layout-${{ matrix.state }}
          path: |
            work/layout-results
            work/layout-candidates
            work/layout-evidence
          retention-days: 7
  report:
    needs: states
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: layout-*
          merge-multiple: true
          path: work
      - run: python -m pipeline.layout_audit report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: layout-audit-evidence
          path: |
            work/layout-results
            work/layout-candidates
            work/layout-evidence
            reports/layout-audit-*
          retention-days: 7
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/layout-audit-* reports/LATEST-LAYOUT.md
          git commit -m "Record layout and scorecard audit $GITHUB_RUN_ID"
          git pull --rebase origin main
          git push origin HEAD:main
