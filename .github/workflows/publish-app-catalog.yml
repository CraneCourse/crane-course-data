name: Publish approved app catalog
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: course-data-publication
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test publication guardrails
        run: python3 publication/test_prepare.py
      - name: Verify the approved snapshot and current deployment
        run: python3 publication/prepare.py --check-live --expected-manifest-sha256 83f6b7c02e6ed43edb540cb2e10a770459f8ada54fd5986564e44eceeaab4475
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: dist
          retention-days: 1
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
