name: Build validated course data
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
concurrency:
  group: course-data-publication
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      states: ${{ steps.selection.outputs.states }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - id: selection
        run: python -m pipeline.prepare
      - id: date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: work/scorecards
          key: scorecards-v1-${{ steps.date.outputs.day }}-${{ hashFiles('inputs/sample.json') }}
      - run: python -m pipeline.scorecards
      - run: python -m pipeline.controls
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecards
          path: work/scorecards
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: controls
          path: work/controls
          retention-days: 7
  states:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        state: ${{ fromJSON(needs.prepare.outputs.states) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y osmium-tool
          pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scorecards
          path: work/scorecards
      - id: date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: work/extracts/${{ matrix.state }}
          key: filtered-v1-${{ matrix.state }}-${{ steps.date.outputs.day }}
      - env:
          COURSE_STATE: ${{ matrix.state }}
        run: |
          python -m pipeline.run_state "$COURSE_STATE"
          python -m pipeline.build_state "$COURSE_STATE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: result-${{ matrix.state }}
          path: |
            work/results
            work/validation
          retention-days: 7
  validate:
    needs: [prepare, states]
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: result-*
          merge-multiple: true
          path: work
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: controls
          path: work/validation
      - name: Compile and run the actual Swift matching kernel
        run: |
          swiftc -O reference/AppKernel.swift reference/main.swift -o /tmp/course-reference
          /tmp/course-reference work/validation work/swift.json
      - name: Replay frozen real controls when present
        run: |
          mkdir -p work/replay
          python -m pipeline.replay
      - name: Verify every export and prepare the complete publication
        run: python -m pipeline.export
      - run: python -m pytest -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: validation-evidence
          path: |
            work/swift.json
            work/validation
            reports
          retention-days: 7
      - name: Commit coverage report and public regression fixtures
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/ tests/fixtures/
          git commit -m "Record validated course-data build $GITHUB_RUN_ID"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
          retention-days: 1
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish only the complete validated dataset
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
