name: Inventory national course directory
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: national-directory-inventory
  cancel-in-progress: false
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m pipeline.catalog_inventory
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: national-directory-inventory
          path: |
            work/catalog
            reports/catalog-inventory-*
          retention-days: 7
      - name: Record inventory only; do not deploy
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/catalog-inventory-* reports/LATEST-CATALOG.md
          git commit -m "Record national directory inventory $GITHUB_RUN_ID"
          git pull --rebase origin main
          git push origin HEAD:main
