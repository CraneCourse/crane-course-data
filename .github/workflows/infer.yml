name: Research missing hole numbering
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Trusted phase-two extraction run with all state jobs successful
        required: true
        default: '38971124409'
        type: string
permissions:
  contents: read
concurrency:
  group: course-data-inference-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m pipeline.verify_input_run
        env:
          INPUT_RUN: ${{ inputs.source_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}
          pattern: result-*
          merge-multiple: true
          path: work
      - name: Blind controls and bounded inference across the complete sample
        run: python -m pipeline.infer_sweep
      - name: Replay the saved real success and ambiguity fixtures
        run: python -m pytest -q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: inference-evidence
          path: |
            work/input-run.json
            work/inference-summary.json
            reports/inference-*
            tests/fixtures/inference
          retention-days: 7
      - name: Commit research evidence only; never deploy hypotheses
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/inference-* reports/LATEST-INFERENCE.md tests/fixtures/inference/
          git commit -m "Record hole-numbering research $GITHUB_RUN_ID"
          git pull --rebase origin main
          git push origin HEAD:main

